<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111b23"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RUNNERS"><title>RUNNERS | Rooftop Trial</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#111b23;color:white;font:600 14px system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top,14px);left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px #000}#hud b{font-size:22px;letter-spacing:3px}#status{position:fixed;top:19%;width:100%;text-align:center;font-size:17px;pointer-events:none;text-shadow:0 2px 6px #000}#stick{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 25px);left:28px;width:116px;height:116px;border:2px solid #ffffff50;border-radius:50%;background:#ffffff16;touch-action:none}#nub{position:absolute;width:48px;height:48px;left:32px;top:32px;background:#ffffff8c;border-radius:50%}.action{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 35px);border:1px solid #ffffff66;border-radius:50%;background:#ffffff35;color:white;font-weight:800;touch-action:none}#jump{right:24px;width:88px;height:88px}#slide{right:125px;width:68px;height:68px;bottom:calc(env(safe-area-inset-bottom) + 45px)}#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101820df;z-index:5}#intro>div{max-width:340px;text-align:center;padding:28px}h1{font-size:42px;letter-spacing:8px;margin:0 0 8px}p{font-weight:400;line-height:1.5}#start{border:0;padding:15px 40px;background:#efaa65;color:#18212b;font-weight:900;letter-spacing:2px;border-radius:3px}#error{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#151c22;padding:30px;text-align:center;z-index:10}</style></head><body><div id="hud"><b>RUNNERS</b><span id="time">00:00</span></div><div id="status">THE STEPS · ROOFTOP TRIAL</div><div id="stick"><div id="nub"></div></div><button id="slide" class="action">SLIDE</button><button id="jump" class="action">JUMP</button><div id="intro"><div><h1>RUNNERS</h1><p>THE STEPS — ROOFTOP TRIAL</p><p>Run across the rooftops. Leap over gaps, avoid obstacles, and reach the gold finish marker. This is a first movement prototype.</p><button id="start">START RUN</button></div></div><div id="error"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x93afbd);scene.fog=new THREE.Fog(0x93afbd,30,110);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe8d1,0x455363,2.2));const sun=new THREE.DirectionalLight(0xffd39a,2.6);sun.position.set(-18,35,-12);scene.add(sun);
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const roof=mat(0xb46e51),edge=mat(0x6d4441),wall=mat(0xbca28b),gold=mat(0xffca67),dark=mat(0x303943),shirt=mat(0xe2a365),skin=mat(0x9b654b);
function cube(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
const platforms=[];for(let i=0;i<18;i++){let z=i*10,x=Math.sin(i*.85)*2.5,w=10;platforms.push({x,z,w});cube(x,0,z,w,1.2,8,roof);cube(x,-4,z,w,7,8,wall);for(let j=-1;j<=1;j+=2)cube(x+j*4.8,.85,z,.35,.55,8,edge);if(i%3===1){cube(x+2,.85,z,1.4,1.1,1.5,dark)}if(i%4===2){cube(x-2,.85,z,2.4,.6,.8,edge)}}
for(let i=0;i<32;i++){let z=i*6,x=(i%2?1:-1)*(12+(i%4)*3);cube(x,-3,z,8,9+(i%5)*2,7,mat([0x9a9a8e,0xd6b18e,0xa9a0a0][i%3]));}
const finish=cube(platforms[17].x,2.2,platforms[17].z,5,.2,.5,gold);
const player=new THREE.Group();scene.add(player);const torso=cube(0,0,0,.65,.95,.4,shirt),head=cube(0,.77,0,.48,.48,.46,skin),legL=cube(-.2,-.72,0,.22,.68,.25,dark),legR=cube(.2,-.72,0,.22,.68,.25,dark);[torso,head,legL,legR].forEach(o=>{scene.remove(o);player.add(o)});
const state={x:0,y:1.5,z:0,vy:0,ground:true,started:false,won:false,slide:0,time:0};let joy={x:0,y:0};const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.code]=false);
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let pointer=null;function move(e){if(e.pointerId!==pointer)return;const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),s=Math.min(len,38)/(len||1);joy.x=dx*s/38;joy.y=dy*s/38;nub.style.transform='translate('+joy.x*38+'px,'+joy.y*38+'px)'}stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);move(e)});stick.addEventListener('pointermove',move);function release(){pointer=null;joy={x:0,y:0};nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
function jump(){if(state.ground&&state.started&&!state.won){state.vy=8.8;state.ground=false}}document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('slide').addEventListener('pointerdown',e=>{e.preventDefault();state.slide=.7});document.getElementById('start').onclick=()=>{document.getElementById('intro').style.display='none';state.started=true};
function reset(){state.x=0;state.y=1.5;state.z=0;state.vy=0;state.ground=true;state.time=0;state.won=false;document.getElementById('status').textContent='KEEP MOVING'}
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.04);last=now;if(state.started&&!state.won){state.time+=dt;let ax=joy.x+(keys.KeyD?1:0)-(keys.KeyA?1:0),az=-joy.y+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS?1:0);let len=Math.hypot(ax,az);if(len>1){ax/=len;az/=len}let speed=keys.ShiftLeft?12:8;state.x+=ax*speed*dt;state.z+=az*speed*dt;state.vy-=22*dt;state.y+=state.vy*dt;let onRoof=platforms.some(p=>Math.abs(state.x-p.x)<p.w/2-.15&&Math.abs(state.z-p.z)<4);if(onRoof&&state.y<=1.5&&state.vy<=0){state.y=1.5;state.vy=0;state.ground=true}else if(!onRoof){state.ground=false}if(state.y< -9)reset();state.slide=Math.max(0,state.slide-dt);if(state.z>170){state.won=true;document.getElementById('status').textContent='FINISHED! '+state.time.toFixed(1)+'s · RELOAD TO RACE AGAIN'}document.getElementById('time').textContent=Math.floor(state.time/60).toString().padStart(2,'0')+':'+Math.floor(state.time%60).toString().padStart(2,'0')}
player.position.set(state.x,state.y,state.z);player.scale.y=state.slide>0?.6:1;player.rotation.y=Math.atan2(joy.x,-joy.y||-1);camera.position.lerp(new THREE.Vector3(state.x,state.y+5,state.z-9),.09);camera.lookAt(state.x,state.y+1,state.z+7);finish.rotation.y+=dt;renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){const el=document.getElementById('error');el.style.display='flex';el.textContent='RUNNERS could not start. Try Safari with an internet connection. '+e.message}
</script></body></html>
