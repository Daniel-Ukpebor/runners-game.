name: RUNNERS browser smoke test
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser controller
        run: npm install --no-save playwright-core
      - name: Serve the project
        run: |
          python3 -m http.server 8765 >/tmp/runners-server.log 2>&1 &
          sleep 2
      - name: Test rendering, start, movement and portrait layout
        run: node tests/smoke.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runners-smoke-screenshots
          path: test-results/
          if-no-files-found: ignore
